# EinoKit 应用配置样例。复制为 application.yaml 后按需修改。

server:
  name: EinoKit       # 服务名，用于日志标识
  port: 8080          # HTTP 监听端口（路由不带 /api 前缀，详见 CLAUDE.md）

datasource:           # PostgreSQL 数据源
  driver: postgres
  host: 127.0.0.1
  port: 5432
  username: postgres
  password: postgres
  dbname: einoit
  params: sslmode=disable TimeZone=Asia/Shanghai
  maxIdleConns: 10
  maxOpenConns: 100
  connMaxLifetime: 1800   # 秒
  connMaxIdleTime: 600    # 秒
  logLevel: warn          # silent/error/warn/info
  slowThresholdMs: 200    # 慢 SQL 阈值(毫秒)

redis:                # Redis 缓存
  host: 127.0.0.1
  port: 6379
  password:
  db: 0
  clientName: EinoKit
  poolSize: 50
  minIdleConns: 10
  dialTimeoutMs: 5000
  readTimeoutMs: 3000
  writeTimeoutMs: 3000
  connMaxIdleTime: 600    # 秒

chatmodel:            # 对话模型(agenticopenai / Responses API)
  apiKey:             # 真实 key 只写在 application.yaml(已 gitignore)
  model: gpt-5
  baseURL: https://api.openai.com/v1
  byAzure: false
  timeoutMs: 180000       # 请求超时(毫秒)

checkpoint:           # Redis checkpoint 存储配置(TurnLoop 快照)
  prefix: "eino:checkpoint:"   # key 前缀，留空使用默认 eino:checkpoint:（含冒号，必须加引号）
  ttl: 24h               # 单条快照过期时间(Go duration 字符串，如 24h/30m/1.5h)；留空则永久存储
